name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o dist/gh-subscribe-linux-amd64 -ldflags="-s -w" .

      - name: Build Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -o dist/gh-subscribe-linux-arm64 -ldflags="-s -w" .

      - name: Build macOS AMD64
        run: GOOS=darwin GOARCH=amd64 go build -o dist/gh-subscribe-darwin-amd64 -ldflags="-s -w" .

      - name: Build macOS ARM64
        run: GOOS=darwin GOARCH=arm64 go build -o dist/gh-subscribe-darwin-arm64 -ldflags="-s -w" .

      - name: Build Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -o dist/gh-subscribe-windows-amd64.exe -ldflags="-s -w" .

      - name: List built binaries
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
